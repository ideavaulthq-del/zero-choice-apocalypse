<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>ZERO CHOICE™ · APOCALYPSE COSMIC CLASH (9:16)</title>
<style>
:root{
  --bg-0:#02010b; --bg-1:#100626; --bg-2:#3b0b67;
  --gold:#ffd76b; --pink:#ff9eea; --cyan:#00f0ff;
  --purple:#a855f7; --danger:#ff557f; --success:#4ade80;
  --card-a-1:#ff7a45; --card-a-2:#ff2d78; --card-a-3:#840b55;
  --card-b-1:#59f9ed; --card-b-2:#1679ff; --card-b-3:#2821a3;

  /* largura máxima do "frame" TikTok */
  --max-w: 720px;

  /* 1 % da altura REAL do frame 9:16 — usado em vez de vh */
  --u: min(1dvh, calc(16vw / 9), calc(var(--max-w) * 16 / 900));
}

*{box-sizing:border-box}

html{height:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Interface sem controlos visíveis */
.vote-btn,.meta{display:none !important}
/* ══════════ FRAME 9:16 ══════════ */
#screen{
  position:relative;
  aspect-ratio:9 / 16;
  width:min(100vw, calc(100dvh * 9 / 16), var(--max-w));
  height:auto;
  max-height:100dvh;
  overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,var(--bg-2) 0%,var(--bg-1) 45%,var(--bg-0) 100%);
  display:flex;
  flex-direction:column;
  gap:var(--u);
  padding:calc(2 * var(--u)) 3% calc(var(--u)) 3%;
  isolation:isolate;
  box-shadow:
    0 0 60px rgba(168,85,247,.55),
    0 0 140px rgba(168,85,247,.30),
    0 0 240px rgba(168,85,247,.15);
}

.cosmic-aura{
  position:absolute;top:50%;left:50%;width:92%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,transparent 55%,rgba(168,85,247,.14) 63%,transparent 72%);
  pointer-events:none;z-index:0;
  animation:auraSpin 30s linear infinite;filter:blur(2px);
}
@keyframes auraSpin{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stars{opacity:.85;z-index:1}
#fx{z-index:8}
header,.question,.arena,.bottom,.timer,.event,.vote-btn{position:relative;z-index:2}

header{text-align:center}

h1{
  font-size:clamp(22px, calc(5.2 * var(--u)), 44px);
  margin:0;color:var(--gold);
  text-shadow:0 0 20px #fa00f8,0 0 40px rgba(0,240,255,.35);
  font-weight:1000;letter-spacing:-1px;
}
.sub{font-weight:900;letter-spacing:3px;color:var(--pink);font-size:11px}
.status{display:flex;justify-content:space-between;font-weight:900;font-size:12px;margin-top:7px}
.live{color:var(--danger)}

.event{
  padding:calc(1.3 * var(--u)) calc(1.6 * var(--u));
  border-radius:14px;
  background:linear-gradient(90deg,#fff55a,#ff8d35);
  color:#26052c;text-align:center;
  font-size:clamp(11px, calc(2 * var(--u)), 16px);
  font-weight:1000;box-shadow:0 0 26px #ff4e9955;
  min-height:calc(5 * var(--u));
  display:flex;align-items:center;justify-content:center;
}

.question{text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:calc(9 * var(--u))}
.question small{color:var(--pink);font-weight:900;letter-spacing:2px}
.question strong{font-size:clamp(16px, calc(3.2 * var(--u)), 28px);line-height:1.13}

.timer{
  --ring-color:var(--gold);--p:100%;
  margin:0 auto;
  width:clamp(52px, calc(9 * var(--u)), 72px);
  height:clamp(52px, calc(9 * var(--u)), 72px);
  display:grid;place-items:center;border-radius:50%;
  background:conic-gradient(var(--ring-color) var(--p),#33204f 0);
  box-shadow:0 0 20px #fc5df5;transition:box-shadow .3s;
}
.timer span{
  width:83%;height:83%;border-radius:50%;background:#08051b;
  display:grid;place-items:center;
  font-size:clamp(20px, calc(3.6 * var(--u)), 30px);
  font-weight:1000;transition:transform .15s,color .2s;
}
.timer.low{
  --ring-color:var(--danger);box-shadow:0 0 26px var(--danger);
  animation:lowPulse .8s ease-in-out infinite;
}
.timer.low span{color:var(--danger)}
@keyframes lowPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}

.arena{display:grid;grid-template-columns:1fr 1fr;gap:calc(1.2 * var(--u));flex:1;min-height:0;perspective:800px}

.choice{
  position:relative;border:2px solid transparent;border-radius:24px;
  padding:calc(1.8 * var(--u)) calc(1.4 * var(--u));
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  text-align:center;min-width:0;font-family:inherit;color:#fff;cursor:pointer;
  box-shadow:inset 0 0 35px #ffffff22,0 15px 30px #0008;
  transform:rotateY(var(--angle,0deg));
  transition:transform .5s,filter .5s,border-color .3s,box-shadow .3s;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.a{background:linear-gradient(155deg,var(--card-a-1),var(--card-a-2) 55%,var(--card-a-3));--angle:5deg}
.b{background:linear-gradient(155deg,var(--card-b-1),var(--card-b-2) 55%,var(--card-b-3));--angle:-5deg}
.choice:not(:disabled):hover{filter:brightness(1.08)}
.choice:disabled{cursor:default}
.choice.selected-a{border-color:var(--pink);box-shadow:0 0 24px rgba(255,61,154,.7),inset 0 0 40px rgba(255,61,154,.15),0 15px 30px #0008}
.choice.selected-b{border-color:var(--cyan);box-shadow:0 0 24px rgba(0,240,255,.7),inset 0 0 40px rgba(0,240,255,.15),0 15px 30px #0008}

.choice .check{
  position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;font-size:16px;font-weight:1000;
  background:var(--success);color:#052e16;opacity:0;transform:scale(.5);
  transition:opacity .25s,transform .25s;box-shadow:0 0 14px rgba(74,222,128,.8);
}
.choice.voted .check{opacity:1;transform:scale(1)}
.choice.confirm-flash{animation:confirmFlash .45s ease-out}
@keyframes confirmFlash{
  0%{transform:rotateY(var(--angle)) scale(1);filter:brightness(1)}
  50%{transform:rotateY(var(--angle)) scale(1.06);filter:brightness(1.6)}
  100%{transform:rotateY(var(--angle)) scale(1);filter:brightness(1)}
}

.letter{
  align-self:flex-start;border-radius:14px;background:#fff;color:#1b0a36;
  font-weight:1000;font-size:clamp(18px, calc(3.4 * var(--u)), 26px);
  padding:3px 12px;
}
.emoji{
  font-size:clamp(40px, calc(9 * var(--u)), 90px);
  text-shadow:0 10px 8px #0006;
  animation:float 2.8s ease-in-out infinite;
}
.b .emoji{animation-delay:-1.3s}
.answer{
  font-weight:1000;
  font-size:clamp(13px, calc(2.6 * var(--u)), 24px);
  line-height:1.13;text-shadow:0 2px 4px #0007;overflow-wrap:anywhere;
}
.votes{
  font-size:clamp(14px, calc(2.5 * var(--u)), 22px);
  font-weight:1000;background:#0005;border-radius:20px;padding:4px 12px;
}
.bar{height:8px;width:100%;background:#0006;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:50%;transition:width .5s}

.bottom{text-align:center;font-weight:900}
.bottom strong{
  display:block;color:#fff46b;
  font-size:clamp(13px, calc(2.4 * var(--u)), 22px);
  min-height:1.3em;text-shadow:0 0 12px rgba(255,244,107,.4);
}
.bottom small{color:#cbbbe8;font-size:10px;letter-spacing:1px;opacity:.7}
.meta{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0;font-size:12px;font-weight:900}
.meta b{color:var(--gold)}
.icon-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:#fff;border-radius:10px;padding:3px 9px;font-size:13px;cursor:pointer;
  font-family:inherit;transition:background .2s;
}
.icon-btn:hover{background:rgba(255,255,255,.18)}

.winner{
  filter:brightness(1.35) saturate(1.2);
  box-shadow:0 0 30px rgba(0,240,255,.8),inset 0 0 50px rgba(0,240,255,.25),0 15px 30px #0008 !important;
}
.loser{filter:grayscale(.75) brightness(.5)}
.shake{animation:shake .35s linear 3}
@keyframes float{50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes shake{
  0%,100%{transform:translate(0)}
  25%{transform:translate(8px,3px)}
  50%{transform:translate(-7px,-5px)}
  75%{transform:translate(4px,7px)}
}

.vote-btn{
  align-self:center;
  min-width:clamp(170px, calc(30 * var(--u)), 220px);
  padding:calc(1.6 * var(--u)) calc(4 * var(--u));
  border-radius:999px;
  background:linear-gradient(135deg,var(--purple),#6366f1);
  border:2px solid rgba(0,240,255,.55);
  color:#fff;
  font-size:clamp(13px, calc(2.2 * var(--u)), 18px);
  font-weight:1000;letter-spacing:5px;text-transform:uppercase;
  box-shadow:0 0 24px rgba(0,240,255,.35),0 0 48px rgba(168,85,247,.25),inset 0 1px 0 rgba(255,255,255,.2);
  cursor:pointer;font-family:inherit;
  transition:transform .2s,box-shadow .25s,opacity .25s;
  touch-action:manipulation;
}
.vote-btn:disabled{
  opacity:.45;cursor:not-allowed;filter:saturate(.4);
  box-shadow:0 0 12px rgba(0,240,255,.15),0 0 24px rgba(168,85,247,.12);
}
.vote-btn.active{animation:votePulse 1.3s ease-in-out infinite}
.vote-btn.voted{
  background:linear-gradient(135deg,var(--success),#16a34a);
  border-color:rgba(255,255,255,.4);animation:none;
}
.vote-btn:not(:disabled):active{transform:scale(.95)}
@keyframes votePulse{
  0%,100%{box-shadow:0 0 24px rgba(0,240,255,.5),0 0 48px rgba(168,85,247,.35);transform:scale(1)}
  50%{box-shadow:0 0 40px rgba(0,240,255,.95),0 0 80px rgba(168,85,247,.7);transform:scale(1.04)}
}

/* ── compacto para frames pequenos (viewport baixa OU estreita) ── */
@media (max-height: 660px), (max-width: 380px){
  #screen{gap:calc(.6 * var(--u));padding:calc(1 * var(--u)) 2.5%}
  .event{min-height:calc(4 * var(--u))}
  .choice{padding:calc(1.2 * var(--u));border-radius:18px}
  .emoji{font-size:clamp(34px, calc(7 * var(--u)), 60px)}
  .question{min-height:calc(6 * var(--u))}
  .question strong{font-size:clamp(14px, calc(2.8 * var(--u)), 20px)}
  .bottom small{display:none}
  .meta{font-size:11px;gap:6px}
}

@media (prefers-reduced-motion: reduce){
  .emoji,.shake,.choice.confirm-flash,.cosmic-aura,
  .vote-btn.active,.timer.low{animation:none !important}
}
</style>
</head>
<body>
<main id="screen" role="application" aria-label="Jogo ZERO CHOICE">
  <div class="cosmic-aura" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <header>
    <h1>ZERO CHOICE™</h1>
    <div class="sub">APOCALYPSE · COSMIC CLASH</div>
    <div class="status">
      <span class="live" aria-live="polite">● SIMULAÇÃO AO VIVO</span>
      <span id="round">RONDA 001</span>
    </div>
  </header>

  <div class="event" id="event" role="status" aria-live="polite">
    ⚡ A REALIDADE ESTÁ A FALHAR ⚡
  </div>

  <div class="question">
    <small>QUAL DESTES DESASTRES ESCOLHES?</small>
    <strong id="question">O UNIVERSO ESTÁ PREPARADO?</strong>
  </div>

  <div class="timer" id="timer" aria-label="Tempo restante">
    <span id="seconds">15</span>
  </div>

  <section class="arena">
    <button class="choice a" id="ca" data-choice="A" type="button" aria-pressed="false">
      <span class="letter">A</span>
      <div class="emoji" id="ea">🦆</div>
      <div class="answer" id="ta">PATOS CÓSMICOS</div>
      <div class="votes"><span id="va">50%</span></div>
      <div class="bar"><i id="ba"></i></div>
      <span class="check" aria-hidden="true">✓</span>
    </button>

    <button class="choice b" id="cb" data-choice="B" type="button" aria-pressed="false">
      <span class="letter">B</span>
      <div class="emoji" id="eb">👽</div>
      <div class="answer" id="tb">ALIENS MALUCOS</div>
      <div class="votes"><span id="vb">50%</span></div>
      <div class="bar"><i id="bb"></i></div>
      <span class="check" aria-hidden="true">✓</span>
    </button>
  </section>

  <button id="voteBtn" class="vote-btn" type="button" disabled>
    <span class="vote-label">VOTE</span>
  </button>

  <footer class="bottom">
    <strong id="bottom">A OU B? O DESTINO ESTÁ NAS TUAS MÃOS!</strong>
    <div class="meta">
      <span id="streak" title="Sequência atual">🔥 <b>0</b></span>
      <span id="record" title="Recorde de sequência">🏆 <b>0</b></span>
      <span id="winRate" title="Taxa de acerto">🎯 <b>0%</b></span>
      <button id="muteBtn" class="icon-btn" type="button" aria-label="Alternar som">🔊</button>
      <button id="resetBtn" class="icon-btn" type="button" aria-label="Repor estatísticas">↻</button>
    </div>
    <small>DEMONSTRAÇÃO · VOTOS SIMULADOS · GUARDADO LOCALMENTE</small>
  </footer>
</main>

<script>
(() => {
  'use strict';

  const VOTE_SECONDS  = 15;
  const RESULT_MS     = 4200;
  const USER_WEIGHT   = 25;
  const DRIFT_TICK    = 7;
  const MIN_PCT       = 2;
  const MAX_PCT       = 98;
  const TICK_SOUND_AT = 5;

  const ROUNDS = [
    ['Quem assume o comando da Terra?','🦆','UM PATO DE 80 METROS','👽','UM ALIEN QUE SÓ SABE DANÇAR'],
    ['Qual é o pior pequeno-almoço?','🍝','ESPARGUETE COM PASTA DE DENTES','🧼','SABONETE PANADO'],
    ['O que cai do céu?','🧀','UMA LUA DE QUEIJO DERRETIDO','🐙','MILHÕES DE POLVOS DE CHAPÉU'],
    ['Qual é a nova lei universal?','🦖','DINOSSAUROS COBRAM RENDA','🍅','TOMATES TORNAM-SE PRESIDENTES'],
    ['Quem invade a tua sala?','🛸','UM OVNI CHEIO DE GALINHAS','🐧','300 PINGUINS COM MEGAFONES'],
    ['Como acaba o mundo?','🥔','BATATAS GANHAM CONSCIÊNCIA','🪩','A TERRA VIRA BOLA DE DISCOTECA'],
    ['Qual é o teu novo transporte?','🐌','CARACOL A JATO','🚀','FOGUETÃO FEITO DE GELATINA'],
    ['O que acontece à gravidade?','🧲','TODOS COLAM AO FRIGORÍFICO','🎈','AS CASAS FLUTUAM NO CÉU'],
    ['Qual é o novo idioma mundial?','🦆','TODOS FALAM QUÁ QUÁ','🤖','TODOS FALAM COMO ROBÔS'],
    ['Quem apresenta o telejornal?','🐈','GATO COM BIGODE DE OURO','🦑','LULA COM 8 MICROFONES'],
    ['O que surge no oceano?','🍕','UMA PIZZA DO TAMANHO DE PORTUGAL','🐋','BALEIA QUE CANTA ÓPERA'],
    ['Quem controla o tempo?','⏰','DESPERTADOR GIGANTE MALDISPOSTO','🥒','PEPINO MÁGICO DO FUTURO'],
    ['O que substitui os carros?','🛒','CARRINHOS DE SUPERMERCADO VOADORES','🦀','CARANGUEJOS DE PATINS'],
    ['Qual é a nova moeda?','🍌','CASCAS DE BANANA','🧦','MEIAS DESPARELHADAS'],
    ['Que desastre acontece na Lua?','🐄','VACAS FAZEM UM FESTIVAL','🎪','PALHAÇOS CONSTROEM UM CASTELO'],
  ];

  const EVENTS = [
    '🚨 ALERTA: O UNIVERSO ENTROU EM MODO BATATA',
    '👽 INTERFERÊNCIA EXTRATERRESTRE DETETADA',
    '🦆 O SUPREMO PATO EXIGE RESPOSTAS',
    '☄️ METEORITO DE GELATINA A APROXIMAR-SE',
    '📺 A TELEVISÃO GANHOU VIDA PRÓPRIA',
    '🛸 REALIDADE ALTERNATIVA DESBLOQUEADA',
    '🍅 EMERGÊNCIA: TOMATES EM REVOLTA',
  ];

  const $ = id => document.getElementById(id);
  const el = {
    screen:$('screen'), round:$('round'), event:$('event'),
    question:$('question'), timer:$('timer'), seconds:$('seconds'),
    ca:$('ca'), ea:$('ea'), ta:$('ta'), va:$('va'), ba:$('ba'),
    cb:$('cb'), eb:$('eb'), tb:$('tb'), vb:$('vb'), bb:$('bb'),
    voteBtn:$('voteBtn'), voteLabel:null,
    bottom:$('bottom'), streak:$('streak'), record:$('record'),
    winRate:$('winRate'), muteBtn:$('muteBtn'), resetBtn:$('resetBtn'),
  };
  el.voteLabel = el.voteBtn.querySelector('.vote-label');

  /* ── ÁUDIO ── */
  const Sound = (() => {
    let ctx = null;
    const prefs = { muted: localStorage.getItem('zc_muted') === '1' };
    function getCtx(){
      if (!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { ctx = new AC(); } catch { return null; }
      }
      if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
      return ctx;
    }
    function tone(freq,dur=0.1,type='sine',vol=0.1,delay=0){
      if (prefs.muted) return;
      const c = getCtx(); if (!c) return;
      const t0 = c.currentTime + delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
    function noise(dur=0.7,vol=0.35){
      if (prefs.muted) return;
      const c = getCtx(); if (!c) return;
      const len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
      const s = c.createBufferSource(); s.buffer = buf;
      const g = c.createGain(); g.gain.value = vol;
      const fl = c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=1200;
      s.connect(fl).connect(g).connect(c.destination); s.start();
    }
    return {
      get muted(){ return prefs.muted; },
      set muted(v){ prefs.muted = v; localStorage.setItem('zc_muted', v ? '1' : '0'); },
      init()    { getCtx(); },
      select()  { tone(620, 0.06, 'triangle', 0.09); },
      confirm() { tone(520, 0.08, 'sine', 0.12); tone(780, 0.1, 'sine', 0.12, 0.06); },
      change()  { tone(420, 0.06, 'triangle', 0.08); },
      tick(u)   { tone(u ? 880 : 660, 0.05, 'square', u ? 0.08 : 0.05); },
      explode() { noise(0.9, 0.4); tone(75, 0.7, 'sawtooth', 0.18); },
      win()     { [523,659,784,1047].forEach((f,i)=> tone(f, 0.18, 'triangle', 0.14, i*0.09)); },
      lose()    { [420,320,220].forEach((f,i)=> tone(f, 0.22, 'sawtooth', 0.1, i*0.12)); },
      miss()    { tone(300, 0.15, 'sine', 0.1); tone(240, 0.15, 'sine', 0.1, 0.15); },
    };
  })();

  /* ── STORAGE ── */
  const Stats = {
    key: 'zc_stats_v1',
    defaults: () => ({ rounds:0, streak:0, record:0, wins:0, losses:0, votes:0, missed:0 }),
    load(){
      try {
        const s = JSON.parse(localStorage.getItem(this.key));
        return s && typeof s === 'object' ? { ...this.defaults(), ...s } : this.defaults();
      } catch { return this.defaults(); }
    },
    save(s){ try { localStorage.setItem(this.key, JSON.stringify(s)); } catch {} },
    reset(){ this.save(this.defaults()); return this.defaults(); },
  };

  /* ── ESTADO ── */
  const state = {
    idx: 0, phase: 'vote', secs: VOTE_SECONDS, aPct: 50,
    userPick: null, selected: null,
    stats: Stats.load(), resultTimer: null,
  };

  /* ── CANVAS ── */
  const canvas = (() => {
    const c = $('stars'), cx = c.getContext('2d');
    const f = $('fx'),    fx = f.getContext('2d');
    let w=0, h=0, stars=[], particles=[], rafId=null, running=true;

    function resize(){
      w = c.width  = f.width  = el.screen.clientWidth;
      h = c.height = f.height = el.screen.clientHeight;
      stars = Array.from({length:100}, () => ({
        x: Math.random()*w, y: Math.random()*h,
        r: 0.4 + Math.random()*1.8, s: 0.1 + Math.random()*0.7,
      }));
      fx.clearRect(0,0,w,h);
    }
    function frame(){
      if (!running){ rafId = null; return; }
      cx.clearRect(0,0,w,h);
      cx.fillStyle = '#ffffffaa';
      for (const s of stars){
        s.y += s.s; if (s.y > h) s.y = 0;
        cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, Math.PI*2); cx.fill();
      }
      fx.clearRect(0,0,w,h);
      particles = particles.filter(p => p.life > 0);
      for (const p of particles){
        p.life -= 1; p.x += p.vx; p.y += p.vy; p.vy += 0.19;
        fx.fillStyle = `hsla(${p.hue},100%,65%,${Math.min(1, p.life/25)})`;
        fx.fillRect(p.x, p.y, p.r, p.r);
      }
      rafId = requestAnimationFrame(frame);
    }
    function ensure(){ if (rafId === null && running) rafId = requestAnimationFrame(frame); }
    function pause(){ running = false; if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; } }
    function resume(){ running = true; ensure(); }
    function burst(n=90){
      const cx0 = w/2, cy0 = h*0.48;
      for (let i=0;i<n;i++) particles.push({
        x:cx0, y:cy0,
        vx:(Math.random()-0.5)*17, vy:(Math.random()-0.8)*18,
        life:55+Math.random()*30, r:2+Math.random()*6, hue:Math.random()*360,
      });
    }
    return { resize, ensure, pause, resume, burst };
  })();

  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

  /* ── RENDER ── */
  function renderVotes(){
    const aR = Math.round(state.aPct);
    el.va.textContent = aR + '%';
    el.vb.textContent = (100 - aR) + '%';
    el.ba.style.width = aR + '%';
    el.bb.style.width = (100 - aR) + '%';
  }
  function renderTimer(){
    el.seconds.textContent = state.secs;
    el.timer.style.setProperty('--p', ((state.secs / VOTE_SECONDS) * 100).toFixed(1) + '%');
    el.timer.classList.toggle('low', state.secs <= TICK_SOUND_AT && state.phase === 'vote');
  }
  function renderVoteButton(){
    const b = el.voteBtn, label = el.voteLabel;
    b.classList.remove('active', 'voted');
    if (state.phase === 'result'){
      b.disabled = true;
      label.textContent = state.userPick ? `VOTASTE: ${state.userPick}` : 'NÃO VOTASTE';
      return;
    }
    if (state.userPick){
      b.disabled = false; b.classList.add('voted');
      label.textContent = `VOTADO: ${state.userPick} · MUDAR`;
    } else if (state.selected){
      b.disabled = false; b.classList.add('active');
      label.textContent = `CONFIRMAR ${state.selected}`;
    } else {
      b.disabled = true; label.textContent = 'VOTE';
    }
  }
  function renderStats(){
    const s = state.stats;
    el.streak.innerHTML = `🔥 <b>${s.streak}</b>`;
    el.record.innerHTML = `🏆 <b>${s.record}</b>`;
    const rate = s.votes ? Math.round((s.wins / s.votes) * 100) : 0;
    el.winRate.innerHTML = `🎯 <b>${rate}%</b>`;
    el.muteBtn.textContent = Sound.muted ? '🔇' : '🔊';
  }
  function renderSelection(){
    el.ca.classList.remove('selected-a');
    el.cb.classList.remove('selected-b');
    if (state.selected === 'A') el.ca.classList.add('selected-a');
    if (state.selected === 'B') el.cb.classList.add('selected-b');
    el.ca.setAttribute('aria-pressed', state.selected === 'A' ? 'true' : 'false');
    el.cb.setAttribute('aria-pressed', state.selected === 'B' ? 'true' : 'false');
  }

  /* ── RONDA ── */
  function startRound(){
    clearTimeout(state.resultTimer);
    const r = ROUNDS[state.idx % ROUNDS.length];
    el.question.textContent = r[0];
    el.ea.textContent = r[1]; el.ta.textContent = r[2];
    el.eb.textContent = r[3]; el.tb.textContent = r[4];
    el.round.textContent = 'RONDA ' + String(state.idx + 1).padStart(3, '0');
    el.event.textContent = EVENTS[state.idx % EVENTS.length];
    el.ca.className = 'choice a';
    el.cb.className = 'choice b';
    el.ca.disabled = false; el.cb.disabled = false;
    el.bottom.textContent = 'A OU B? O DESTINO ESTÁ NAS TUAS MÃOS!';
    Object.assign(state, { phase:'vote', secs:VOTE_SECONDS, aPct:50, userPick:null, selected:null });
    renderVotes(); renderTimer(); renderSelection(); renderVoteButton();
  }

  /* ── AÇÕES ── */
  function selectCard(side){
    if (state.phase !== 'vote' || state.userPick) return;
    if (state.selected === side) state.selected = null;
    else { state.selected = side; Sound.select(); }
    renderSelection(); renderVoteButton();
  }
  function confirmVote(){
    if (state.phase !== 'vote' || state.userPick || !state.selected) return;
    const side = state.selected;
    state.userPick = side;
    if (side === 'A') state.aPct = clamp(state.aPct + USER_WEIGHT, MIN_PCT, MAX_PCT);
    else              state.aPct = clamp(state.aPct - USER_WEIGHT, MIN_PCT, MAX_PCT);
    renderVotes();
    const card = side === 'A' ? el.ca : el.cb;
    card.classList.add('voted', 'confirm-flash');
    setTimeout(() => card.classList.remove('confirm-flash'), 500);
    Sound.confirm();
    if (navigator.vibrate){ try { navigator.vibrate(25); } catch {} }
    el.bottom.textContent = `VOTASTE ${side}! A REALIDADE TREMEU...`;
    renderVoteButton();
  }
  function resetVote(){
    if (state.phase !== 'vote' || !state.userPick) return;
    const old = state.userPick;
    if (old === 'A') state.aPct = clamp(state.aPct - USER_WEIGHT, MIN_PCT, MAX_PCT);
    else              state.aPct = clamp(state.aPct + USER_WEIGHT, MIN_PCT, MAX_PCT);
    el.ca.classList.remove('voted');
    el.cb.classList.remove('voted');
    state.userPick = null; state.selected = null;
    renderVotes(); renderSelection(); renderVoteButton(); Sound.change();
  }
  function handleCardClick(side){
    if (state.phase !== 'vote') return;
    if (state.userPick === side){ resetVote(); return; }
    if (state.userPick) resetVote();
    selectCard(side);
  }

  /* ── TICK ── */
  function tick(){
    if (state.phase !== 'vote') return;
    state.secs = Math.max(0, state.secs - 1);
    if (state.secs <= TICK_SOUND_AT && state.secs > 0) Sound.tick(true);
    const drift = Math.round((Math.random() - 0.5) * DRIFT_TICK * 2);
    state.aPct = clamp(state.aPct + drift, MIN_PCT, MAX_PCT);
    renderVotes(); renderTimer();
    if (state.secs <= 0) endRound();
  }

  function endRound(){
    if (!state.userPick && state.selected) confirmVote();
    state.phase = 'result';
    const aWin = state.aPct >= 50;
    const winner = aWin ? 'A' : 'B';
    const userWon = state.userPick === winner;
    el.ca.classList.add(aWin ? 'winner' : 'loser');
    el.cb.classList.add(aWin ? 'loser' : 'winner');

    const s = state.stats; s.rounds++;
    if (state.userPick){
      s.votes++;
      if (userWon){ s.wins++; s.streak++; if (s.streak > s.record) s.record = s.streak; }
      else        { s.losses++; s.streak = 0; }
    } else s.missed++;
    Stats.save(s); renderStats();

    el.event.textContent = '💥 RUTURA INTERDIMENSIONAL CONFIRMADA 💥';
    if (!state.userPick){
      el.bottom.textContent = `⚠️ NÃO VOTASTE! VENCEU ${winner}`; Sound.miss();
    } else if (userWon){
      el.bottom.textContent = `🎉 ACERTASTE! ${winner} VENCEU · STREAK ${s.streak}🔥`; Sound.win();
    } else {
      el.bottom.textContent = `💀 FALHASTE! VENCEU ${winner} · STREAK PERDIDA`; Sound.lose();
    }

    Sound.explode(); canvas.burst(90);
    el.screen.classList.add('shake');
    setTimeout(() => el.screen.classList.remove('shake'), 1000);
    el.ca.disabled = true; el.cb.disabled = true;
    renderVoteButton();

    clearTimeout(state.resultTimer);
    state.resultTimer = setTimeout(() => { state.idx++; startRound(); }, RESULT_MS);
  }

  /* ── LISTENERS ── */
  el.ca.addEventListener('click', () => handleCardClick('A'));
  el.cb.addEventListener('click', () => handleCardClick('B'));
  el.voteBtn.addEventListener('click', () => {
    if (state.phase !== 'vote') return;
    if (state.userPick){ resetVote(); return; }
    confirmVote();
  });
  el.muteBtn.addEventListener('click', () => {
    Sound.muted = !Sound.muted; renderStats();
    if (!Sound.muted) Sound.select();
  });
  el.resetBtn.addEventListener('click', () => {
    if (!confirm('Repor todas as estatísticas?')) return;
    state.stats = Stats.reset(); renderStats(); Sound.change();
  });
  ['click','touchstart','keydown'].forEach(evt => {
    document.addEventListener(evt, () => Sound.init(), { once:true, passive:true });
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) canvas.pause(); else canvas .resume();
  });
  window.addEventListener('resize', canvas.resize);
  canvas.resize();
  canvas.ensure();
  renderStats();
  startRound();
  setInterval(tick,1000);
})();
</script>
</body>
</html>
