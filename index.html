const $=id=>document.getElementById(id);let idx=0,seconds=15,percent=50,phase='vote',audio,master;const AC=window.AudioContext||window.webkitAudioContext;
function enableAudio(){try{if(!AC)return false;audio??=new AC();if(!master){master=audio.createDynamicsCompressor();master.threshold.value=-22;master.knee.value=14;master.ratio.value=9;master.attack.value=.004;master.release.value=.22;master.connect(audio.destination)}if(audio.state==='suspended')audio.resume().catch(()=>{});return audio.state==='running'}catch{return false}}
