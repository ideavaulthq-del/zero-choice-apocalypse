*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070019;color:white;font-family:system-ui,Arial,sans-serif}body{display:grid;place-items:center}.stage{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#40146c,#080321 70%);isolation:isolate}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 50%,#2aa4ff55,transparent 30%),radial-gradient(circle at 90% 80%,#fc287a44,transparent 32%);pointer-events:none}.art{height:24%;width:100%;position:absolute;top:0;left:0;background-image:linear-gradient(to bottom,transparent 70%,#100522),url('cosmic_art.png');background-size:100% auto;background-position:top center;background-repeat:no-repeat}.content{position:absolute;inset:22% 3% 2%;display:flex;flex-direction:column;gap:1.1%;align-items:stretch}.alert{height:8%;min-height:0;background:linear-gradient(95deg,#ffe85c,#ff9b4b);color:#21062c;border-radius:12px;display:grid;place-items:center;text-align:center;font-size:clamp(11px,2.7vh,26px);font-weight:1000;text-shadow:0 1px #fff8;box-shadow:0 0 25px #ff8b3666;padding:4px}.prompt{text-align:center;height:17%;display:flex;flex-direction:column;justify-content:center;gap:4px}.kicker{color:#fda3ff;font-weight:1000;font-size:clamp(10px,2.1vh,20px);letter-spacing:.07em}.question{font-size:clamp(17px,3.2vh,36px);font-weight:1000;line-height:1.12;text-shadow:0 3px 10px #000}.clock{align-self:center;width:11%;aspect-ratio:1;border:3px solid #f744ed;border-radius:50%;background:#140322;display:grid;place-items:center;color:#ffcf3d;font-size:clamp(17px,3.2vh,35px);font-weight:1000;box-shadow:0 0 18px #f500e4;margin-top:-2%;margin-bottom:-1%;z-index:3}.choice{height:28%;border-radius:18px;border:3px solid #ff9de7;position:relative;overflow:hidden;display:flex;align-items:center;gap:4%;padding:4%;box-shadow:0 0 19px #f8388b99;transition:filter .3s,transform .3s}.choice.a{background:linear-gradient(120deg,#ffad47,#f52982 70%,#521277)}.choice.b{background:linear-gradient(120deg,#10c5ef,#0068dc 60%,#171365);border-color:#48f4ff;box-shadow:0 0 18px #18c6ff99}.letter{position:absolute;top:5%;left:4%;border-radius:12px;background:#fff;color:#ec165a;padding:0 10px;font-size:clamp(22px,5vh,54px);font-weight:1000;box-shadow:0 3px 8px #0005}.b .letter{color:#0663db}.character{font-size:clamp(65px,12vh,145px);width:40%;text-align:center;filter:drop-shadow(0 8px 7px #0009);animation:float 2.4s ease-in-out infinite}.answer{flex:1;text-align:center;font-size:clamp(14px,2.7vh,31px);font-weight:1000;line-height:1.06;text-shadow:0 3px 6px #0009;overflow-wrap:anywhere}.meter{position:absolute;bottom:4%;right:4%;width:53%;height:12%;background:#17072c99;border-radius:30px;display:flex;align-items:center;padding:3px;gap:5px;font-weight:1000;font-size:clamp(11px,2vh,24px)}.track{flex:1;height:70%;background:#090a31;border-radius:20px;overflow:hidden}.fill{height:100%;width:50%;background:linear-gradient(90deg,#ff5c8d,#ffd18b);border-radius:20px;transition:width .6s}.b .fill{background:linear-gradient(90deg,#00e8fc,#89eeff)}.result{height:9%;display:grid;place-items:center;text-align:center;border:2px solid #ff4bf6;background:#230434ee;border-radius:40px;color:#ffda41;font-size:clamp(14px,3vh,30px);font-weight:1000;text-shadow:0 0 8px #fd61a9;box-shadow:0 0 22px #f000ed88}.disclosure{font-size:clamp(8px,1.1vh,12px);text-align:center;color:#cbb5ed}.winner{filter:brightness(1.25);transform:scale(1.015)}.loser{filter:brightness(.5)}@keyframes float{50%{transform:translateY(-8px) rotate(-5deg)}}@media(min-aspect-ratio:9/16){.stage{width:56.25vh;height:100vh}}@media(max-aspect-ratio:9/16){.stage{width:100vw;height:177.7778vw}}
</style></head><body><main class="stage"><div class="art"></div><div class="content"><div class="alert" id="alert">💥 RUTURA INTERDIMENSIONAL CONFIRMADA 💥</div><div class="prompt"><div class="kicker">QUAL DESTES DESASTRES ESCOLHES?</div><div class="question" id="question"></div></div><div class="clock" id="clock">15</div><div class="choice a" id="cardA"><div class="letter">A</div><div class="character" id="emojiA">🦆</div><div class="answer" id="answerA"></div><div class="meter"><div class="track"><div class="fill" id="fillA"></div></div><span id="pctA">50%</span></div></div><div class="choice b" id="cardB"><div class="letter">B</div><div class="character" id="emojiB">👽</div><div class="answer" id="answerB"></div><div class="meter"><div class="track"><div class="fill" id="fillB"></div></div><span id="pctB">50%</span></div></div><div class="result" id="result">🗳️ A OU B? ESCOLHE!</div><div class="disclosure">ENTRETENIMENTO · RESULTADOS SIMULADOS · SEM LIGAÇÃO AO CHAT</div></div></main><script>

    { q:'Qual é o pior pequeno-almoço?',

    { q:'Quem invade a tua sala?',

    { q:'Como acaba o mundo?',

    { q:'Qual é o novo idioma mundial?',

    { q:'Quem apresenta o telejornal?',

    { q:'O que surge no oceano?',

const $=id=>document.getElementById(id);let idx=0,sec=15,pct=50,phase='vote',audio=null;const names=['💥 RUTURA INTERDIMENSIONAL CONFIRMADA 💥','🦆 ALERTA DE PATOS GALÁCTICOS 🦆','👽 O UNIVERSO PERDEU A CABEÇA 👽','☄️ CAOS CÓSMICO DETETADO ☄️'];function sound(type){try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type==='win'?'sawtooth':'sine';o.frequency.setValueAtTime(type==='win'?360:600,t);o.frequency.exponentialRampToValueAtTime(type==='win'?880:240,t+.22);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.26);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.28)}catch(e){}}function draw(){const r=ROUNDS[idx%ROUNDS.length];$('question').textContent=r.q;$('emojiA').textContent=r.a.e;$('emojiB').textContent=r.b.e;$('answerA').textContent=r.a.t;$('answerB').textContent=r.b.t;$('alert').textContent=names[idx%names.length];$('cardA').className='choice a';$('cardB').className='choice b';$('result').textContent='🗳️ A OU B? ESCOLHE!';phase='vote';sec=15;pct=50;update()}function update(){$('clock').textContent=sec;$('pctA').textContent=Math.round(pct)+'%';$('pctB').textContent=(100-Math.round(pct))+'%';$('fillA').style.width=pct+'%';$('fillB').style.width=(100-pct)+'%'}draw();setInterval(()=>{if(phase==='vote'){sec--;pct=Math.max(15,Math.min(85,pct+(Math.random()-.5)*15));update();if(sec===0){phase='result';const w=pct>=50?'A':'B';$('result').textContent='🏆 VENCEU '+w+'! · SIMULAÇÃO';$('card'+w).classList.add('winner');$('card'+(w==='A'?'B':'A')).classList.add('loser');sound('win');sec=4}}else{sec--;if(sec<=0){idx++;draw()}else $('clock').textContent=sec}},1000);
// Browsers may require one interaction to enable audio; the LIVE never displays controls.
document.addEventListener('pointerdown',()=>{try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}},{once:true});
</script></body></html>
