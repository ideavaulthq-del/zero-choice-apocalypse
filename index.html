const $=id=>document.getElementById(id);let idx=0,sec=15,pct=50,phase='vote',audio=null;const names=['💥 RUTURA INTERDIMENSIONAL CONFIRMADA 💥','🦆 ALERTA DE PATOS GALÁCTICOS 🦆','👽 O UNIVERSO PERDEU A CABEÇA 👽','☄️ CAOS CÓSMICO DETETADO ☄️'];const AudioContextClass=window.AudioContext||window.webkitAudioContext;
