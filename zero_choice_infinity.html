<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ZERO CHOICE INFINITY 7.0</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08031a;
      color: white;
      font-family: system-ui, Arial, sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #3e1169, #08031a 72%);
    }
    #frame {
      width: min(100vw, 56.25dvh);
      height: min(100dvh, 177.777vw);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.15%;
      padding: 2.2% 2.5% 3%;
      overflow: hidden;
      background: radial-gradient(ellipse at 30% 40%, #39136e, #070218 75%);
      isolation: isolate;
    }
    #stars {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    header {
      height: 14%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
    }
    header .duck, header .alien {
      position: absolute;
      font-size: clamp(26px, 7vh, 75px);
      filter: drop-shadow(0 0 12px #f7b);
      animation: bob 3s infinite ease-in-out;
    }
    .duck { left: 0; }
    .alien { right: 0; animation-delay: 1s !important; }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5.8vh, 75px);
      line-height: .86;
      font-weight: 1000;
      letter-spacing: -.06em;
      text-shadow: 0 4px 0 #541058, 0 0 20px #e44cff;
      color: #ffc82e;
    }
    h1 span {
      color: #ff56e7;
      display: block;
    }
    #question {
      height: 20%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6%;
      padding: 0 3%;
    }
    #prompt {
      font-size: clamp(17px, 3vh, 36px);
      line-height: 1.1;
      font-weight: 900;
      text-shadow: 0 2px 12px #c33cff;
    }
    #clock {
      font-size: clamp(44px, 8vh, 100px);
      font-weight: 1000;
      color: #fff300;
      border: 5px solid #fff;
      border-radius: 22px;
      min-width: 34%;
      height: 54%;
      display: grid;
      place-items: center;
      padding: 0 4%;
      line-height: 1;
      box-shadow: 0 0 25px #ffdb00, 0 0 45px #ed28ff;
      background: #16042b;
      text-shadow: 0 0 15px #ff5e00;
      transition: background .2s;
    }
    #clock.urgent {
      background: #b90030;
      animation: pulse .5s infinite alternate;
    }
    #clockbar {
      height: 12px;
      width: 92%;
      background: #251045;
      border: 2px solid #ffffffa8;
      border-radius: 99px;
      overflow: hidden;
    }
    #clockfill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff3479, #fff229, #48ffb6);
      transition: width 1s linear;
    }
    @keyframes pulse {
      to {
        transform: scale(1.08);
        box-shadow: 0 0 36px #ff1d42;
      }
    }
    #options {
      height: 57%;
      display: flex;
      flex-direction: column;
      gap: 2%;
    }
    .option {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      border: 3px solid #ff69d6;
      display: flex;
      align-items: center;
      gap: 2%;
      padding: 3%;
      background: linear-gradient(120deg, #fa467cbb, #511064cc);
      box-shadow: 0 0 20px #b91dd899;
      transition: filter .55s, opacity .55s, transform .55s, box-shadow .55s;
    }
    .option.winner {
      border-color: #fff87b !important;
      box-shadow: 0 0 42px #ffe450, inset 0 0 30px #ffffff66 !important;
      background: linear-gradient(120deg, #ffbf4eaa, #ec44ff99) !important;
      filter: brightness(1.3) saturate(1.3);
      transform: scale(1.015);
      z-index: 2;
    }
    .option.loser {
      filter: brightness(.32) grayscale(.7);
      opacity: .72;
    }
    .option.b {
      border-color: #21e9ff;
      background: linear-gradient(120deg, #126ed5bb, #071b68cc);
      box-shadow: 0 0 20px #12bafc77;
    }
    .letter {
      position: absolute;
      top: 5%;
      left: 4%;
      border-radius: 14px;
      background: #ff2467;
      padding: .3em .5em;
      font-size: clamp(19px, 4vh, 42px);
      font-weight: 1000;
      z-index: 2;
    }
    .b .letter { background: #0078e7; }
    .art {
      flex: 0 0 44%;
      height: 100%;
      width: 44%;
      border-radius: 14px;
      object-fit: cover;
      filter: drop-shadow(0 0 12px #ef72e9);
    }
    .label {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      gap: 6%;
      min-width: 0;
    }
    .label strong {
      font-size: clamp(14px, 2.65vh, 31px);
      line-height: 1.1;
      overflow-wrap: anywhere;
      text-shadow: 0 3px 8px #10051d;
    }
    .meter {
      width: 100%;
      height: 10%;
      min-height: 13px;
      background: #160b2d;
      border-radius: 30px;
      overflow: hidden;
      border: 1px solid #ffffff66;
    }
    .fill {
      height: 100%;
      background: linear-gradient(90deg, #ffb342, #ff2e91);
      width: 50%;
      transition: width 1s;
    }
    .b .fill {
      background: linear-gradient(90deg, #20e5ff, #366cff);
    }
    .pct {
      font-weight: 900;
      font-size: clamp(16px, 3vh, 32px);
    }
    footer {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 4px;
      font-weight: 900;
      font-size: clamp(16px, 2.8vh, 34px);
      color: #ffeb64;
      text-shadow: 0 0 12px #c82cfc;
    }
    small {
      font-size: clamp(9px, 1.3vh, 15px);
      color: #f4d6ff;
      font-weight: 600;
    }
    #flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: #fff;
      opacity: 0;
      transition: opacity .2s;
    }
    @keyframes bob {
      50% { transform: translateY(-12px) rotate(5deg); }
    }
    @media (max-aspect-ratio: 9/16) {
      #frame { width: 100vw; height: 100dvh; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main id="stage">
    <section id="frame">
      <canvas id="stars"></canvas>
      <header>
        <div class="duck">🦆</div>
        <h1>ZERO<span>CHOICE</span></h1>
        <div class="alien">👽</div>
      </header>
      <section id="question">
        <div id="prompt">A preparar a próxima loucura...</div>
        <div id="clock">15</div>
        <div id="clockbar"><div id="clockfill"></div></div>
      </section>
      <section id="options">
        <article class="option">
          <span class="letter">A</span>
          <canvas class="art" id="artA"></canvas>
          <div class="label">
            <strong id="txtA"></strong>
            <div class="meter"><div class="fill" id="barA"></div></div>
            <div class="pct" id="pctA">50%</div>
          </div>
        </article>
        <article class="option b">
          <span class="letter">B</span>
          <canvas class="art" id="artB"></canvas>
          <div class="label">
            <strong id="txtB"></strong>
            <div class="meter"><div class="fill" id="barB"></div></div>
            <div class="pct" id="pctB">50%</div>
          </div>
        </article>
      </section>
      <footer>
        <div id="status">🗳️ ESCOLHE A OU B</div>
        <small>DEMONSTRAÇÃO · RESULTADOS SIMULADOS · SEM LIGAÇÃO AO CHAT</small>
      </footer>
      <div id="flash"></div>
    </section>
  </main>

  <script>
    'use strict';
    const subjects = ['patos espaciais', 'vacas astronautas', 'tomates mutantes', 'pinguins gigantes', 'robôs trapalhões', 'alienígenas dançarinos', 'polvos de chapéu', 'batatas falantes', 'gatos galácticos', 'dinossauros de patins', 'bananas ninja', 'cogumelos luminosos', 'palhaços cósmicos', 'torradeiras voadoras', 'caracóis supersónicos', 'gelados radioativos', 'piratas lunares', 'sapos cantores'];
    const actions = ['invadem', 'transformam', 'conquistam', 'comem', 'pintam', 'hipnotizam', 'teletransportam', 'congelam', 'fazem dançar', 'lançam ao espaço', 'trocam de lugar com', 'fazem desaparecer'];
    const places = ['a Lua', 'Marte', 'o Sol', 'Lisboa', 'um planeta de chocolate', 'um castelo de gelatina', 'a estação espacial', 'o oceano de estrelas', 'uma cidade flutuante', 'o universo inteiro', 'um buraco negro', 'uma discoteca intergaláctica'];
    const emojis = ['🦆', '🐄', '🍅', '🐧', '🤖', '👽', '🐙', '🥔', '🐈', '🦖', '🍌', '🍄', '🤡', '🍞', '🐌', '🍦', '🏴‍☠️', '🐸'];

    const $ = id => document.getElementById(id);
    let seen = new Set(), round = null, t = 15, timer = null, ctx = null, master = null, audioReady = false;

    function choice() {
      let s, a, p, key, tries = 0;
      do {
        s = Math.floor(Math.random() * subjects.length);
        a = Math.floor(Math.random() * actions.length);
        p = Math.floor(Math.random() * places.length);
        key = `${s}:${a}:${p}`;
        tries++;
      } while (seen.has(key) && tries < 1000);

      if (seen.size > subjects.length * actions.length * places.length * .85) seen.clear();
      seen.add(key);
      return { text: `${subjects[s].toUpperCase()} ${actions[a].toUpperCase()} ${places[p].toUpperCase()}`, emoji: emojis[s], s, a, p, key };
    }

    function paint(id, item, seed) {
      let c = $(id), w = 440, h = 400;
      c.width = w; c.height = h;
      let x = c.getContext('2d'), g = x.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, seed ? '#063e9c' : '#7b155e');
      g.addColorStop(1, '#07031f');
      x.fillStyle = g;
      x.fillRect(0, 0, w, h);

      let rnd = n => {
        let z = Math.sin(n * 127.1 + item.s * 311.7 + item.p * 31.3) * 43758.5453;
        return z - Math.floor(z);
      };

      for (let i = 0; i < 75; i++) {
        x.fillStyle = `rgba(255,255,255,${.2 + rnd(i) * .7})`;
        x.beginPath();
        x.arc(rnd(i + 81) * w, rnd(i + 180) * h, rnd(i + 222) * 2.4, 0, 7);
        x.fill();
      }

      x.fillStyle = seed ? '#14c9ff' : '#f65fbc';
      x.shadowColor = x.fillStyle;
      x.shadowBlur = 45;
      x.beginPath();
      x.arc(220, 235, 125, 0, 7);
      x.fill();
      x.shadowBlur = 0;

      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.font = '160px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
      x.fillText(item.emoji, 220, 220);

      x.font = '65px "Segoe UI Emoji", sans-serif';
      x.fillText(['🌕', '🪐', '🌍', '🌌'][item.p % 4], 340, 85);
    }

    function beep(freq, dur, type = 'sine', gain = .1, slide = 0) {
      if (!ctx) return;
      let now = ctx.currentTime, o = ctx.createOscillator(), v = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, now);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), now + dur);
      v.gain.setValueAtTime(.0001, now);
      v.gain.exponentialRampToValueAtTime(Math.max(.0002, gain), now + .015);
      v.gain.exponentialRampToValueAtTime(.0001, now + dur);
      o.connect(v);
      v.connect(master);
      o.start(now);
      o.stop(now + dur + .02);
    }

    function sound(kind) {
      if (!ctx) return;
      if (kind === 'tick') beep(550, 0.07, 'sine', .18);
      if (kind === 'start') {
        beep(330, .18, 'triangle', .27, 300);
        setTimeout(() => beep(660, .14, 'triangle', .25), 180);
      }
      if (kind === 'win') {
        [330, 440, 550, 880].forEach((n, i) => setTimeout(() => beep(n, .22, 'triangle', .29), i * 140));
        setTimeout(() => beep(150, .4, 'sawtooth', .18, -100), 650);
      }
      if (kind === 'fun') {
        let n = round?.A?.s || 0;
        beep(180 + n * 27, .3, 'sawtooth', .23, 350);
        setTimeout(() => beep(500 + n * 18, .2, 'square', .16, -240), 250);
      }
    }

    function unlock() {
      try {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createDynamicsCompressor();
          master.threshold.value = -24;
          master.knee.value = 8;
          master.ratio.value = 12;
          master.attack.value = .002;
          master.release.value = .18;
          let volume = ctx.createGain();
          volume.gain.value = 1;
          master.connect(volume);
          volume.connect(ctx.destination);
        }
        ctx.resume().then(() => {
          audioReady = ctx.state === 'running';
          if (audioReady) sound('start');
        }).catch(() => {});
      } catch (e) {}
    }

    document.addEventListener('pointerdown', unlock, { once: true });
    document.addEventListener('keydown', unlock, { once: true });

    function render() {
      let pct = round.pct;
      $('pctA').textContent = pct + '%';
      $('pctB').textContent = (100 - pct) + '%';
      $('barA').style.width = pct + '%';
      $('barB').style.width = (100 - pct) + '%';
    }

    function next() {
      clearInterval(timer);
      let A = choice(), B = choice();
      while (B.key === A.key) B = choice();

      round = { A, B, pct: 45 + Math.floor(Math.random() * 11) };
      $('prompt').textContent = 'QUAL DESTAS LOUCURAS PREFERES?';
      $('txtA').textContent = A.text;
      $('txtB').textContent = B.text;

      paint('artA', A, 0);
      paint('artB', B, 1);

      $('status').textContent = '🗳️ ESCOLHE A OU B';
      document.querySelectorAll('.option').forEach(el => el.classList.remove('winner', 'loser'));
      $('clock').classList.remove('urgent');
      $('clockfill').style.width = '100%';

      t = 15;
      $('clock').textContent = t;
      render();
      sound('start');

      timer = setInterval(() => {
        t--;
        $('clock').textContent = t;
        $('clockfill').style.width = Math.max(0, t / 15 * 100) + '%';
        $('clock').classList.toggle('urgent', t <= 5);

        if (t > 0) {
          round.pct = Math.max(8, Math.min(92, round.pct + Math.floor(Math.random() * 9) - 4));
          render();
          if (t <= 5) sound('tick');
        } else {
          clearInterval(timer);
          round.pct = Math.max(8, Math.min(92, round.pct + Math.floor(Math.random() * 13) - 6));
          render();

          $('status').textContent = `🏆 VENCEU ${round.pct >= 50 ? 'A' : 'B'}! · SIMULAÇÃO`;
          const cards = document.querySelectorAll('.option');
          cards[0].classList.add(round.pct >= 50 ? 'winner' : 'loser');
          cards[1].classList.add(round.pct < 50 ? 'winner' : 'loser');

          sound('win');
          setTimeout(() => sound('fun'), 900);
          setTimeout(next, 3800);
        }
      }, 1000);
    }

    let stars = $('stars'), sc = stars.getContext('2d');
    function starfield() {
      stars.width = 500;
      stars.height = 900;
      sc.clearRect(0, 0, 500, 900);
      for (let i = 0; i < 150; i++) {
        let x = (i * 137.7) % 500, y = (i * 73.37) % 900;
        sc.fillStyle = `rgba(255,255,255,${.2 + (i % 7) / 10})`;
        sc.fillRect(x, y, i % 9 === 0 ? 2 : 1, i % 9 === 0 ? 2 : 1);
      }
    }

    starfield();
    unlock();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) unlock();
    });
    next();
  </script>
</body>
</html>
